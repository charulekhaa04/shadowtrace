services:
  # ── Backend FastAPI Web Service ───────────────────────────────────────────
  - type: web
    name: shadowtrace-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: DATABASE_URL
        value: "sqlite:///./shadowtrace.db"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: MODEL_DIR
        value: "./data/models"
      - key: CHROMA_DIR
        value: "./data/chroma"
      - key: CORS_ORIGINS
        value: "https://shadowtrace-frontend.onrender.com,http://localhost:5173"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "false"
      - key: RENDER
        value: "true"

  # ── Frontend React Static Site ────────────────────────────────────────────
  - type: static
    name: shadowtrace-frontend
    rootDir: frontend
    buildCommand: "npm install -g pnpm && pnpm install && pnpm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://shadowtrace-backend.onrender.com"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
